<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Etho</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap" rel="stylesheet">
  <link rel="icon" href="./images/favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
    /* ====== Layout ====== */
    body {
      min-height: 100vh;
    }

    .auth-layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.05fr 1fr;
    }

    /* ====== Left brand panel ====== */
    .auth-side {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: var(--space-2xl, 3rem);
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(232, 0, 28, 0.28), transparent 45%),
        radial-gradient(circle at 80% 85%, rgba(139, 0, 0, 0.35), transparent 50%),
        linear-gradient(160deg, #0d0505 0%, #1a0505 55%, #0a0303 100%);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      /* This panel is always dark, in both themes — so it needs its
         own fixed text palette instead of the page's theme variables,
         which flip to dark ink in light mode and vanish here. */
      --text-main: #FFFFFF;
      --text-muted: #D8B4B4;
      --text-dim: #9C7676;
      --accent: #FF4444;
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    .auth-side::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(ellipse at 30% 30%, black, transparent 70%);
      pointer-events: none;
    }

    .auth-side-top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .auth-side-top img {
      height: 2.1rem;
      filter: drop-shadow(0 0 12px rgba(232, 0, 28, 0.6));
    }

    .auth-side-top span {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.3px;
      color: var(--text-main);
    }

    .auth-quote-block {
      position: relative;
      z-index: 1;
      max-width: 420px;
    }

    .auth-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: var(--space-lg);
    }

    .auth-eyebrow::before {
      content: '';
      width: 22px;
      height: 1px;
      background: var(--accent);
    }

    .auth-quote {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 500;
      font-size: clamp(1.5rem, 2.4vw, 2rem);
      line-height: 1.35;
      color: var(--text-main);
      margin-bottom: var(--space-lg);
      transition: opacity 0.5s ease;
    }

    .auth-quote-author {
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: opacity 0.5s ease;
    }

    .auth-quote-author::before {
      content: '— ';
      color: var(--accent);
    }

    .auth-side-bottom {
      position: relative;
      z-index: 1;
      display: flex;
      gap: var(--space-xl);
    }

    .auth-stat-num {
      font-family: 'Fraunces', serif;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1;
    }

    .auth-stat-label {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ====== Right form panel ====== */
    .auth-main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl);
      background: var(--bg-body);
      background-image: var(--bg-blob);
    }

    .auth-card {
      width: 100%;
      max-width: 380px;
      animation: authRise 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes authRise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-mobile-logo {
      display: none;
      height: 2.4rem;
      margin: 0 auto var(--space-lg);
      filter: drop-shadow(0 0 12px rgba(232, 0, 28, 0.5));
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.3rem;
    }

    .auth-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: var(--space-xl);
    }

    .auth-tabs {
      position: relative;
      display: flex;
      background: var(--recess-3);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: var(--space-xl);
    }

    .auth-tab {
      position: relative;
      z-index: 1;
      flex: 1;
      text-align: center;
      padding: 0.6rem 0;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.25s ease;
      user-select: none;
    }

    .auth-tab.active { color: white; }

    .auth-tab-indicator {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: calc(100% - 8px);
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 4px 15px var(--primary-glow);
      transition: transform 0.3s var(--bounce);
    }

    .auth-tab-indicator.pos-1 { transform: translateX(100%); }

    .auth-field {
      margin-bottom: var(--space-md);
      border-radius: 20px;
    }

    .auth-field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: var(--text-main, #f5f5f5);
      margin-bottom: 0.5rem;
    }

    .auth-input-wrap {
      position: relative;
    }

    .auth-field input[type="text"],
    .auth-field input[type="email"],
    .auth-field input[type="password"] {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.6rem;
      background: var(--recess-3);
      border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.12));
      border-radius: var(--radius-md, 10px);
      color: var(--text-main, #f5f5f5);
      font-size: 0.92rem;
      font-family: inherit;
      -webkit-text-fill-color: var(--text-main, #f5f5f5);
      caret-color: var(--primary, #e8001c);
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .auth-field input[type="text"]::placeholder,
    .auth-field input[type="email"]::placeholder,
    .auth-field input[type="password"]::placeholder {
      color: var(--text-dim);
      opacity: 0.8;
    }

    .auth-field input[type="text"]:hover,
    .auth-field input[type="email"]:hover,
    .auth-field input[type="password"]:hover {
      border-color: color-mix(in srgb, var(--text-main) 25%, var(--glass-border));
    }

    .auth-field input[type="text"]:focus,
    .auth-field input[type="email"]:focus,
    .auth-field input[type="password"]:focus {
      outline: none;
      border-color: var(--primary, #e8001c);
      background: var(--recess-4);
      box-shadow: 0 0 0 3px var(--primary-glow, rgba(232, 0, 28, 0.18));
    }

    /* Kill browser autofill styling so text stays visible (Chrome forces a white/yellow bg + black text otherwise) */
    .auth-field input:-webkit-autofill,
    .auth-field input:-webkit-autofill:hover,
    .auth-field input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text-main, #f5f5f5);
      -webkit-box-shadow: 0 0 0 1000px var(--recess-3) inset;
      transition: background-color 9999s ease-in-out 0s;
    }

    .auth-input-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.85rem;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .auth-field input:focus ~ .auth-input-icon {
      color: var(--primary);
    }

    .auth-toggle-visibility {
      position: absolute;
      right: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 0.4rem 0.5rem;
      font-size: 0.85rem;
      transition: color 0.2s ease;
    }

    .auth-toggle-visibility:hover { color: var(--text-main); }

    .auth-strength {
      display: flex;
      gap: 4px;
      margin-top: 0.5rem;
      height: 3px;
    }

    .auth-strength-bar {
      flex: 1;
      border-radius: 2px;
      background: var(--recess-3);
      transition: background 0.25s ease;
    }

    .auth-submit {
      width: 100%;
      justify-content: center;
      margin-top: var(--space-sm);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .auth-submit:disabled {
      opacity: 0.7;
      cursor: default;
      transform: none !important;
    }

    .auth-submit .fa-spinner { display: none; }
    .auth-submit.loading .fa-spinner { display: inline-block; }
    .auth-submit.loading .btn-default-icon { display: none; }
    .auth-submit.loading .btn-label { opacity: 0.85; }

    .auth-message {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius-md);
      margin-top: 0;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: var(--transition);
    }

    .auth-message.show {
      opacity: 1;
      max-height: 60px;
      margin-top: var(--space-md);
    }

    .auth-message.error {
      color: #ffb4b4;
      background: rgba(232, 0, 28, 0.1);
      border: 1px solid rgba(232, 0, 28, 0.35);
    }

    .auth-message.success {
      color: #86e6a8;
      background: rgba(74, 222, 128, 0.08);
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .auth-panel { display: none; }
    .auth-panel.active { display: block; }

    .auth-forgot-link {
      display: block;
      margin-top: 0.5rem;
      background: none;
      border: none;
      padding: 0;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      text-align: right;
      width: 100%;
      transition: var(--transition);
    }
    .auth-forgot-link:hover { color: var(--primary); }

    .auth-footnote {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: var(--space-xl);
    }

    /* ====== Responsive ====== */
    @media (max-width: 900px) {
      .auth-layout { grid-template-columns: 1fr; }
      .auth-side { display: none; }
      .auth-main { padding: var(--space-lg); }
      .auth-mobile-logo { display: block; }
    }
  </style>
</head>
<body>

  <div class="auth-layout" style="grid-template-columns: 1fr;">
    <div class="auth-main">
      <div class="auth-card">
        <img src="https://i.postimg.cc/1XtyPCjv/etho-high-resolution-logo-transparent.png" alt="Etho Logo" class="auth-mobile-logo" style="display:block;">
        <div class="auth-title">Set a new password</div>
        <div class="auth-subtitle" id="reset-subtitle">Choose a new password for your account.</div>

        <div id="reset-form">
          <div class="auth-field">
            <label for="new-password">New password</label>
            <div class="auth-input-wrap">
              <input type="password" id="new-password" placeholder="Min. 6 characters" autocomplete="new-password">
              <i class="fa-solid fa-lock auth-input-icon"></i>
              <button type="button" class="auth-toggle-visibility" data-target="new-password" aria-label="Show password">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="auth-field">
            <label for="confirm-password">Confirm password</label>
            <div class="auth-input-wrap">
              <input type="password" id="confirm-password" placeholder="••••••••" autocomplete="new-password">
              <i class="fa-solid fa-lock auth-input-icon"></i>
            </div>
          </div>
          <button class="checklist-add-btn auth-submit" id="reset-btn">
            <i class="fa-solid fa-check btn-default-icon"></i>
            <i class="fa-solid fa-spinner fa-spin"></i>
            <span class="btn-label">Update password</span>
          </button>
        </div>

        <div class="auth-message" id="auth-message"></div>

        <div class="auth-footnote"><a href="login.html" style="color: var(--text-muted);">Back to sign in</a></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    const messageEl = document.getElementById("auth-message");
    const formEl = document.getElementById("reset-form");
    const subtitleEl = document.getElementById("reset-subtitle");

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = "auth-message show " + type;
    }

    // Password show/hide toggle
    document.querySelectorAll(".auth-toggle-visibility").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        const icon = btn.querySelector("i");
        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        icon.classList.toggle("fa-eye", !isHidden);
        icon.classList.toggle("fa-eye-slash", isHidden);
      });
    });

    // The recovery link Supabase emails takes the user here with a token
    // in the URL that the SDK exchanges for a session automatically on
    // load (detectSessionInUrl, on by default). If that session never
    // shows up, the link was invalid, already used, or expired.
    let hasRecoverySession = false;

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" || (event === "SIGNED_IN" && session)) {
        hasRecoverySession = true;
      }
    });

    setTimeout(async () => {
      if (hasRecoverySession) return;
      const user = await getCurrentUser();
      if (user) { hasRecoverySession = true; return; }
      formEl.style.display = "none";
      subtitleEl.textContent = "This link is invalid or has expired.";
      showMessage("Request a new reset link from the sign-in page.", "error");
    }, 1500);

    document.getElementById("reset-btn").addEventListener("click", async () => {
      const btn = document.getElementById("reset-btn");
      const password = document.getElementById("new-password").value;
      const confirm = document.getElementById("confirm-password").value;

      if (!hasRecoverySession) {
        return showMessage("This link is invalid or has expired. Request a new one from the sign-in page.", "error");
      }
      if (password.length < 6) return showMessage("Password must be at least 6 characters.", "error");
      if (password !== confirm) return showMessage("Passwords don't match.", "error");

      btn.classList.add("loading");
      btn.disabled = true;
      try {
        const { error } = await supabaseClient.auth.updateUser({ password });
        if (error) throw error;
        showMessage("Password updated! Redirecting…", "success");
        setTimeout(() => { window.location.href = APP_HOME; }, 1200);
      } catch (err) {
        btn.classList.remove("loading");
        btn.disabled = false;
        showMessage(err.message || "Couldn't update password.", "error");
      }
    });

    document.querySelectorAll("#reset-form input").forEach(input => {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") document.getElementById("reset-btn").click();
      });
    });
  </script>
</body>
</html>
